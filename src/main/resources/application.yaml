# Defaults target the local stack (docker compose dependencies, app on the host).
# Every URL, credential, timeout and interval is overridable through the env var in the placeholder.
spring:
  application:
    name: client-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clientmanagement}
    username: ${DB_USERNAME:clientmanagement}
    password: ${DB_PASSWORD:clientmanagement}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (ADR-2); Hibernate only checks the mapping against it.
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # ADR-5: a publish only counts once the broker confirms it, and an unroutable message comes back as a
    # return instead of being dropped. Both a nack and a return send the event to the outbox.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    # CUSTOMER_STATUS_CHANGE consumer (ticket 07, NFR-9). A transient failure gets 3 attempts in total (first
    # delivery + max-retries 2, exponential backoff in-thread), then the message is rejected to the DLQ. Unprocessable
    # messages skip the retry (StatusChangeRetryConfiguration). A rejected message is never requeued.
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: ${STATUS_CHANGE_RETRY_MAX_RETRIES:2}
          initial-interval: ${STATUS_CHANGE_RETRY_INITIAL_INTERVAL:1s}
          multiplier: ${STATUS_CHANGE_RETRY_MULTIPLIER:2}
          max-interval: ${STATUS_CHANGE_RETRY_MAX_INTERVAL:10s}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Expected "iss" claim. Keycloak is started with KC_HOSTNAME=http://localhost:8081, so tokens
          # fetched from the host carry this issuer even when the app runs inside compose.
          issuer-uri: ${ISSUER_URI:http://localhost:8081/realms/client-management}
          # Keys are fetched from here; inside compose it points at http://keycloak:8080 (see docker-compose.yml).
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/realms/client-management/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    # NFR-3: on a failed statement Hibernate logs the database's error detail, which for the unique CPF
    # constraint is "Key (cpf)=(<full CPF>) already exists". The exception itself still propagates:
    # CustomerService turns it into a 409 and logs the masked CPF, and anything unexpected reaches the 500 handler.
    org.hibernate.orm.jdbc.error: OFF

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      # Needed to see each circuit breaker's state (e.g. score: CIRCUIT_OPEN) inside the circuitBreakers component.
      show-details: always
  health:
    # NFR-10: the Score circuit breaker is visible in /actuator/health but never makes the app DOWN.
    circuitbreakers:
      enabled: true

app:
  score:
    base-url: ${SCORE_BASE_URL:http://localhost:8089}
    connect-timeout: ${SCORE_CONNECT_TIMEOUT:1s}
    read-timeout: ${SCORE_READ_TIMEOUT:2s}
  messaging:
    confirm-timeout: ${RABBITMQ_CONFIRM_TIMEOUT:5s}
  outbox:
    relay-interval: ${OUTBOX_RELAY_INTERVAL:5s}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    # The wait after a failed relay attempt is resilience4j.retry.instances.outbox (below).
  pagination:
    # Used when a list request omits page/size; default-size must be within 1..100 (NFR-14).
    default-page: ${PAGINATION_DEFAULT_PAGE:0}
    default-size: ${PAGINATION_DEFAULT_SIZE:20}

# Score resilience (NFR-4, NFR-6). The circuit breaker wraps the retry, so one request counts as one call.
# Only transient failures are retried and recorded: 5xx (HttpServerErrorException) and I/O errors including
# timeouts (ResourceAccessException). 404, other 4xx and malformed bodies are final answers and never retried.
resilience4j:
  retry:
    instances:
      score:
        max-attempts: ${SCORE_RETRY_MAX_ATTEMPTS:2}
        wait-duration: ${SCORE_RETRY_WAIT_DURATION:200ms}
        enable-exponential-backoff: true
        exponential-backoff-multiplier: ${SCORE_RETRY_BACKOFF_MULTIPLIER:2}
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
      # Outbox relay (ADR-5, AC-6, NFR-7). The relay reads the wait settings to compute next_attempt_at after the
      # n-th failure (wait-duration x multiplier^(n-1), capped; nothing sleeps in-thread) and max-attempts as the
      # give-up limit. Every failure type counts the same, so there are no exception lists. With the 5 s relay
      # interval the 15 s cap keeps delivery within 30 s of a RabbitMQ recovery; 5760 attempts at that cap cover
      # about 24 h of outage. A row whose attempts reach max-attempts is dead: it stays in outbox_events and is no
      # longer picked up. Raising max-attempts later brings dead rows back into retry by itself.
      outbox:
        max-attempts: ${OUTBOX_RETRY_MAX_ATTEMPTS:5760}
        wait-duration: ${OUTBOX_RETRY_WAIT_DURATION:1s}
        enable-exponential-backoff: true
        exponential-backoff-multiplier: ${OUTBOX_RETRY_BACKOFF_MULTIPLIER:2}
        exponential-max-wait-duration: ${OUTBOX_RETRY_MAX_WAIT_DURATION:15s}
  circuitbreaker:
    instances:
      score:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${SCORE_CB_SLIDING_WINDOW_SIZE:10}
        # Resilience4j defaults this to 100, which would keep a 10-call window from ever opening.
        minimum-number-of-calls: ${SCORE_CB_SLIDING_WINDOW_SIZE:10}
        failure-rate-threshold: ${SCORE_CB_FAILURE_RATE_THRESHOLD:50}
        wait-duration-in-open-state: ${SCORE_CB_WAIT_DURATION_IN_OPEN_STATE:10s}
        # NFR-10: Score is optional. Health shows this breaker as CIRCUIT_OPEN, a status the overall health
        # aggregation ignores, so an open circuit never turns /actuator/health DOWN.
        register-health-indicator: true
        allow-health-indicator-to-fail: false
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
